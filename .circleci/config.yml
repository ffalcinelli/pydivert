version: 2.1

# This configuration is intended to disable CircleCI builds and checks for this repository.
# All jobs and workflows have been removed or set to do nothing.

jobs:
  disabled:
    docker:
      - image: cimg/base@sha256:35e5e29930ab565475a4f2aa9b4124998ed67dbc7b0e2dd5f420a4189d08d0d2 # stable
    steps:
      - run:
          name: "CircleCI is disabled"
          command: echo "CircleCI builds and checks are disabled for this project."

workflows:
  version: 2
  disable-workflow:
    jobs:
      - disabled
