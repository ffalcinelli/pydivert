version: 2.1

parameters:
  python_version:
    type: string
    default: "3.12"

jobs:
  test-linux:
    parameters:
      py_version:
        type: string
      os_image:
        type: string
    machine:
      image: << parameters.os_image >>
    steps:
      - checkout
      - run:
          name: Fix host resolution
          command: |
            echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
      - run:
          name: Install system dependencies
          command: |
            # Remove broken Google Chrome repository to avoid GPG errors
            sudo rm -f /etc/apt/sources.list.d/google*.list
            sudo apt-get update
            # Use DEBIAN_FRONTEND=noninteractive to avoid hangs on service restart prompts
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                                   clang llvm libbpf-dev linux-headers-$(uname -r) gcc-multilib
            # Standalone bpftool is available in Ubuntu 24.04+; fallback to kernel-tools for 22.04
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y bpftool || \
                   sudo DEBIAN_FRONTEND=noninteractive apt-get install -y linux-tools-common linux-tools-$(uname -r)
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Install Python and dependencies
          command: |
            uv python install << parameters.py_version >>
            uv sync --extra test --extra linux
      - run:
          name: Prepare eBPF
          command: |
            uname -a
            ls -l /sys/kernel/btf/vmlinux || echo "BTF not found"
            sudo bpftool btf dump file /sys/kernel/btf/vmlinux format c > pydivert/bpf/vmlinux.h
            ls -l pydivert/bpf/vmlinux.h
            clang -O2 -g -target bpf -I pydivert/bpf -c pydivert/bpf/pydivert.bpf.c -o pydivert/bpf/pydivert.bpf.o
            ls -l pydivert/bpf/pydivert.bpf.o
      - run:
          name: Configure loopback
          command: sudo ethtool -K lo rx off tx off || true
      - run:
          name: Run tests
          command: |
            sudo -E .venv/bin/python -m pytest pydivert --capture=no -v --cov pydivert --cov-report=xml
      - run:
          name: Upload coverage
          command: |
            sudo chown $(whoami):$(whoami) coverage.xml
            # Use uv to install and run the modern codecov-cli for better reliability in CI
            uv pip install codecov-cli --quiet
            .venv/bin/codecovcli --verbose upload-process -t ${CODECOV_TOKEN} -f coverage.xml --fail-on-error

workflows:
  version: 2
  build:
    jobs:
      - test-linux:
          matrix:
            parameters:
              py_version: ["3.10", "3.11", "3.12", "3.13"]
              os_image: ["ubuntu-2204:2024.01.1", "ubuntu-2404:current"]
