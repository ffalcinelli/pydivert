name: CI

on:
  push:
    branches: [ main, linux-ebpf ]
  pull_request:
    branches: [ main, linux-ebpf ]
  workflow_dispatch: {}

jobs:
  verify-pinning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify Pinning
        uses: ffalcinelli/pinner/action@dff77e1d17140dc88eb827aa7d833f995796b92b # v0.0.11

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Run linting
      run: uv run --extra lint ruff check pydivert
    - name: Run formatting check
      run: uv run --extra lint ruff format --check pydivert
    - name: Run type checking
      run: uv run --extra typecheck --extra test ty check pydivert

  test-windows:
    needs: lint
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --extra test
    - name: Fetch pre-built binaries
      run: uv run python scripts/fetch_binaries.py
    - name: Run tests
      run: uv run pytest pydivert --capture=no -v --cov pydivert --cov-report=xml
    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  test-linux:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libbpf-dev

    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --extra test --extra linux

    - name: Fetch pre-built binaries
      run: python scripts/fetch_binaries.py

    - name: Configure loopback
      run: sudo ethtool -K lo rx off tx off || true

    - name: Run tests
      run: sudo -E .venv/bin/python -m pytest pydivert --capture=no -v --cov pydivert --cov-report=xml

    - name: Cleanup eBPF hooks
      if: always()
      run: |
        if [ -f .venv/bin/python ]; then
          sudo -E .venv/bin/python -c "import pydivert; pydivert.Divert.unregister()" || true
        fi

    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
